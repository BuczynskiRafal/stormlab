<figure class="method-fig method-fig--model">
  <div class="method-fig-scroll">
    <svg viewBox="0 0 720 562" role="img" aria-labelledby="mf-model-title mf-model-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="mf-model-title">The model, layer by layer</title>
      <desc id="mf-model-desc">Layer diagram of the graph model, top to bottom; n is the number of conduits in the network. Input: 66 features per conduit, a matrix of n by 66. Normalisation with the statistics of the training set. Graph step 1: relu of X times W self, plus A-hat times X times W neigh, plus b; followed by layer normalisation and dropout 0.2, giving n by 64. Graph step 2: the same form applied to that output, again with layer normalisation and dropout 0.2, giving n by 64. A dense layer with softmax maps 64 to 9 for each conduit. Output: 9 action probabilities per conduit, n by 9. The aggregation matrix A-hat, n by n and built from the network, is a side input to both graph steps. A bracket around normalisation to softmax notes 5 training runs whose probabilities are averaged, and 17,742 parameters per run.</desc>
      <defs>
        <marker id="mf-model-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mf-head-fill" d="M0,1.5 L10,5 L0,8.5 Z"/></marker>
        <marker id="mf-model-arrow-p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mf-head-fill mf-head-fill--primary" d="M0,1.5 L10,5 L0,8.5 Z"/></marker>
      </defs>
      <rect class="mf-box" x="196" y="4" width="328" height="50" rx="8"/>
      <text class="mf-title" x="360" y="26" text-anchor="middle">66 features per conduit</text>
      <text class="mf-meta" x="360" y="44" text-anchor="middle">n × 66</text>
      <rect class="mf-box" x="196" y="88" width="328" height="50" rx="8"/>
      <text class="mf-title" x="360" y="110" text-anchor="middle">Normalisation</text>
      <text class="mf-body" x="360" y="128" text-anchor="middle">statistics of the training set</text>
      <rect class="mf-box mf-box--primary" x="196" y="172" width="328" height="92" rx="8"/>
      <text class="mf-title mf-title--primary" x="360" y="196" text-anchor="middle">Graph step 1</text>
      <text class="mf-math" x="360" y="222" text-anchor="middle">relu(<tspan class="mf-var">X</tspan> · <tspan class="mf-var">W</tspan><tspan class="mf-sub" dy="4">self</tspan><tspan dy="-4"> + (<tspan class="mf-var">Â</tspan> · <tspan class="mf-var">X</tspan>) · <tspan class="mf-var">W</tspan><tspan class="mf-sub" dy="4">neigh</tspan><tspan dy="-4"> + <tspan class="mf-var">b</tspan>)</tspan></tspan></text>
      <path class="mf-divider" d="M208,236 H512"/>
      <text class="mf-body" x="360" y="254" text-anchor="middle">Layer norm · Dropout 0.2</text>
      <rect class="mf-box mf-box--primary" x="196" y="298" width="328" height="92" rx="8"/>
      <text class="mf-title mf-title--primary" x="360" y="322" text-anchor="middle">Graph step 2</text>
      <text class="mf-math" x="360" y="348" text-anchor="middle">relu(<tspan class="mf-var">H</tspan> · <tspan class="mf-var">W</tspan><tspan class="mf-sub" dy="4">self</tspan><tspan dy="-4"> + (<tspan class="mf-var">Â</tspan> · <tspan class="mf-var">H</tspan>) · <tspan class="mf-var">W</tspan><tspan class="mf-sub" dy="4">neigh</tspan><tspan dy="-4"> + <tspan class="mf-var">b</tspan>)</tspan></tspan></text>
      <path class="mf-divider" d="M208,362 H512"/>
      <text class="mf-body" x="360" y="380" text-anchor="middle">Layer norm · Dropout 0.2</text>
      <rect class="mf-box" x="196" y="424" width="328" height="50" rx="8"/>
      <text class="mf-title" x="360" y="446" text-anchor="middle">Dense · softmax</text>
      <text class="mf-body" x="360" y="464" text-anchor="middle">64 → 9 per conduit</text>
      <rect class="mf-box" x="196" y="508" width="328" height="50" rx="8"/>
      <text class="mf-title" x="360" y="530" text-anchor="middle">9 action probabilities per conduit</text>
      <text class="mf-meta" x="360" y="548" text-anchor="middle">n × 9</text>
      <path class="mf-line" d="M360.0,54 V85.3" marker-end="url(#mf-model-arrow)"/>
      <path class="mf-line mf-line--primary" d="M360.0,138 V169.3" marker-end="url(#mf-model-arrow-p)"/>
      <text class="mf-meta" x="372" y="159">n × 66</text>
      <path class="mf-line mf-line--primary" d="M360.0,264 V295.3" marker-end="url(#mf-model-arrow-p)"/>
      <text class="mf-meta" x="372" y="285">n × 64</text>
      <path class="mf-line mf-line--primary" d="M360.0,390 V421.3" marker-end="url(#mf-model-arrow-p)"/>
      <text class="mf-meta" x="372" y="411">n × 64</text>
      <path class="mf-line" d="M360.0,474 V505.3" marker-end="url(#mf-model-arrow)"/>

      <text class="mf-meta" x="86" y="320" text-anchor="middle">n × n</text>
      <path class="mf-line mf-line--primary" d="M164,280.0 H182"/>
      <path class="mf-line mf-line--primary" d="M182,280.0 V223 Q182,217 188,217 H193.3" marker-end="url(#mf-model-arrow-p)"/>

      <text class="mf-body" x="564" y="300">probabilities</text>
      <text class="mf-meta" x="564" y="329">17,742 parameters</text>
      <text class="mf-meta" x="564" y="346">per run</text>
    </svg>
  </div>
  <figcaption><strong>Figure 3.</strong> Two graph steps with shared weights for every conduit, which is why one set of weights serves a network of any size.</figcaption>
</figure>
