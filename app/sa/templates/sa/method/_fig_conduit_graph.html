<figure class="method-fig method-fig--conduit-graph">
  {# Two panels, two SVGs: side by side on a wide screen, stacked below 640 px, so the right panel never hides behind a scroller. The right SVG keeps the coordinates of the original single drawing through its viewBox origin (392). #}
  <div class="method-fig-panels">
    <svg class="method-fig-panel method-fig-panel--network" viewBox="0 0 266 334" role="img" aria-labelledby="mf-conduit-graph-title mf-conduit-graph-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="mf-conduit-graph-title">The same network, two ways</title>
      <desc id="mf-conduit-graph-desc">Two panels. Left, a sewer network in plan: six conduits labelled a to f join seven nodes, six manholes and an outfall. Conduits a, b and c form one branch and d and e a second; both meet in a manhole from which conduit f runs to the outfall. Arrows on the conduits show the flow direction. Right, the same network as the graph the model sees: each conduit is a node, and a directed edge joins two conduits when the outlet manhole of one is the inlet manhole of the next, giving edges a to b, b to c, d to e, c to f and e to f. Conduit f is the one being assessed; c and e are one link upstream of it, b and d two links upstream, and a lies beyond the reach of one graph step.</desc>
      <defs>
        <marker id="mf-graph-pipe-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mf-pipe-head" d="M0,1.5 L10,5 L0,8.5 Z"/></marker>
      </defs>

      <path class="mf-rule" d="M0,32 H262"/>
      <polyline class="mf-pipe" points="22,84 58,80 94,76" marker-mid="url(#mf-graph-pipe-head)"/>
      <text class="mf-label" x="58" y="68" text-anchor="middle">a</text>
      <polyline class="mf-pipe" points="94,76 125,94 156,112" marker-mid="url(#mf-graph-pipe-head)"/>
      <text class="mf-label" x="135" y="84" text-anchor="middle">b</text>

      <text class="mf-label" x="188" y="145" text-anchor="middle">c</text>
      <polyline class="mf-pipe" points="28,240 69,235 110,230" marker-mid="url(#mf-graph-pipe-head)"/>
      <text class="mf-label" x="69" y="257" text-anchor="middle">d</text>
      <polyline class="mf-pipe" points="110,230 153,202 196,174" marker-mid="url(#mf-graph-pipe-head)"/>
      <text class="mf-label" x="161" y="224" text-anchor="middle">e</text>
      <polyline class="mf-pipe" points="196,174 221,174 246,174" marker-mid="url(#mf-graph-pipe-head)"/>
      <text class="mf-label" x="221" y="162" text-anchor="middle">f</text>
      <circle class="mf-manhole" cx="22" cy="84" r="5.5"/>

      <text class="mf-body" x="34" y="326">conduit, flow direction</text>
    </svg>

    <p class="method-fig-becomes" aria-hidden="true">becomes</p>

      <circle class="mf-node mf-node--self" cx="631" cy="174" r="15"/>

      <text class="mf-body" x="584" y="326">beyond one step</text>
    </svg>
  </div>
  <figcaption><strong>Figure 2.</strong> Conduits become nodes; an edge joins two conduits that meet in a manhole and points with the flow. For conduit f, one graph step averages over f itself, c and e, and with a smaller weight b and d.</figcaption>
</figure>
