name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: '**/requirements*.txt'

      - name: Install dependencies (including TensorFlow)
        run: uv pip install --system -r requirements.txt

      - name: Run core and domain tests
        run: pytest app/sa/core/tests stormlab/tests -p no:cacheprovider

      - name: Run Django tests
        env:
          DJANGO_ENV: testing
        working-directory: app
        run: python manage.py test accounts sa
