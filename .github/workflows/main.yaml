name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: '**/requirements*.txt'

      - name: Install dependencies (including TensorFlow)
        run: uv pip install --system -r requirements.txt

      - name: Run core and domain tests
        run: pytest app/sa/core/tests stormlab/tests -p no:cacheprovider

      - name: Run Django tests
        env:
          DJANGO_ENV: testing
        working-directory: app
        run: python manage.py test accounts sa

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: '**/requirements*.txt'

      - name: Install runtime dependencies
        run: uv pip install --system -r app/requirements.txt

      - name: Check production settings and collect static files
        working-directory: app
        env:
          DJANGO_ENV: production
          ALLOWED_HOSTS: example.com
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput

      - name: Build the production image
        run: docker build --tag stormlab-web:ci .

      - name: Start the image and wait until it is healthy
        run: |
          docker run --detach --name web --read-only --tmpfs /tmp \
            --volume db:/data/db --volume media:/data/media \
            --env SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            --env ALLOWED_HOSTS=example.com stormlab-web:ci
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' web)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs web
          [ "$status" = healthy ]

      - name: Validate the Compose file and the proxy configuration
        run: |
          printf 'DOMAIN=example.com\nSECRET_KEY=unused\n' > .env
          docker compose config --quiet
          docker run --rm --env DOMAIN=example.com \
            --volume "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
